name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  evals:
    # Two things, both free and offline.
    #
    # The smoke policies replace the judgement and leave every other layer exactly as it
    # runs in production — the simulated ERP is read for real, the guardrails run for
    # real — so they fail if the harness, the guardrails or the gate stop working.
    #
    # Then the model itself, from recordings, gated against the committed baseline. No
    # GPU, no API key, no bill, and a regression in the agent's judgement stops the merge
    # the same way a failing test does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One repetition, not two. At 36 cases the four policies take over three minutes
      # at --reps 2, and the second rep only re-rolls the ERP's dice: the policies
      # themselves are fixed. This job exists to prove the harness still works, not to
      # accumulate statistical power.
      - run: npm run evals -- --smoke --reps 1

      # The model, from recordings. The cassette is named by a hash of the whole request
      # — model, seed, system prompt, rendered facts, tool schema, token ceiling — so a
      # change to any of them makes the recording missing and this step exits 1 asking
      # for a re-record. A refactor that cannot affect the model replays for free.
      #
      # This is what makes the gate below a real gate rather than a local ritual.
      - run: npm run evals -- --replay --split test --reps 4
      - run: npm run gate
